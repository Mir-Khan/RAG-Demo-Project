# pgvector/pgvector ships Postgres 16 with the vector extension prebuilt.
# One command to a reproducible DB that matches what we'd run in CI.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Throwaway local-only credential, intentionally trivial: this container only
      # ever binds to localhost on whoever's machine runs `docker compose up`, never
      # reachable over a network, never holds anything but a disposable dev corpus.
      # Not a real secret -- don't "fix" this by wiring in a production credential.
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
